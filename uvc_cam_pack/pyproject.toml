[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "uvc-lab"
version = "0.1.0"
description = "Reproducible UVC acquisition and multi-model image sequence analysis"
requires-python = ">=3.11"
dependencies = [
  "PyQt6>=6.7,<7", "numpy>=2.0,<3", "opencv-python>=4.10,<5",
  "scipy>=1.14,<2", "openpyxl>=3.1,<4", "pyserial>=3.5,<4",
  "cv2-enumerate-cameras>=1.2,<2; sys_platform == 'win32'",
]

[project.optional-dependencies]
ai = ["ultralytics>=8.4.0,<9"]
test = ["pytest>=8,<10"]

[project.scripts]
uvc-lab = "uvc_lab.__main__:main"

[tool.setuptools.packages.find]
include = ["uvc_lab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

